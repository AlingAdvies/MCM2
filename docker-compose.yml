services:
  mcm2-api:
    build:
      context: .
      target: development
    ports:
      - "5001:5001"
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data

# Valkey stond hier tot 2026-08-06 als queue voor BullMQ (ADR-004). Verwijderd
# omdat er geen enkele dependency en geen enkele regel code was die hem
# aanriep: geen bullmq, geen ioredis. Een container die in elke omgeving
# draait en een REDIS_URL die een afhankelijkheid suggereert die er niet is,
# kosten meer dan ze opleveren.
#
# ADR-004 blijft geldig als "besluit genomen, nog niet toegepast": komt er een
# queue voor bulkmail, herinneringen of exports, dan is het Valkey.
#
# MinIO staat er wél nog, en dat is een ander geval: die is nodig voor Issue
# #46 (objectopslag voor uploads), het enige onderdeel dat nu nog op de
# containerschijf staat. Zie docs/architectuur/exit-route-hosting.md §4.

volumes:
  minio-data:
