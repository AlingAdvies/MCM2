# Eén omgeving (acceptatie óf productie) op saxombp.
#
# ── Waarom één bestand voor twee omgevingen ────────────────────────────────
#
# Acceptatie en productie horen identiek te zijn op de configuratie na. Twee
# aparte compose-bestanden lopen onvermijdelijk uiteen — dan draait acceptatie
# op een instelling die productie niet heeft, en bewijst een groene acceptatie
# niets meer. Alles wat verschilt komt daarom uit variabelen, en die staan in
# `acceptatie.env` en `productie.env` op de server.
#
# ── Gebruik ────────────────────────────────────────────────────────────────
#
# Niet met de hand aanroepen. `scripts/deploy.js` doet dit, met de juiste
# variabelen en een rookproef erna:
#
#   npm run deploy:acceptatie
#   npm run deploy:productie
#
# Handmatig, op de server zelf:
#   docker compose --env-file acceptatie.env -p mcm2-acceptatie \
#     -f docker-compose.omgeving.yml up -d
#
# ── Wat hier bewust NIET staat ─────────────────────────────────────────────
#
# Geen `build:`. Dit bestand haalt een image op dat CI al gebouwd en getest
# heeft. Zou de server zelf bouwen, dan is het per definitie een ánder artefact
# dan wat door de poorten kwam — andere basis-laag, andere npm-resolutie — en
# dan bewijst acceptatie niets over productie. Dat is de kern van OTAP.

name: ${COMPOSE_PROJECT_NAME}

services:
  # ── De lokale database — niet elke omgeving heeft er een ──────────────────
  #
  # Acceptatie draait tegen deze container. Staging niet: die praat met een
  # Supabase-project, en dat is de hele reden dat staging bestaat. Productie
  # draait Postgres bij AWS in Ierland achter een connection pooler, en een
  # repetitie in een lokale container bewijst het verkeerde — de pooler is
  # precies waar het anders gaat (§1 van het OTAP-plan).
  #
  # Vandaar het profiel. `docker compose --profile lokale-db` start hem;
  # zonder dat profiel bestaat de service niet en start er ook geen container.
  #
  # Waarom een profiel en niet `--scale db=0`: schalen naar nul laat de
  # afhankelijkheid in `depends_on` staan, en dan wacht de api op een
  # healthcheck die nooit komt.
  db:
    profiles: ["lokale-db"]
    image: postgres:17.6
    environment:
      POSTGRES_PASSWORD: ${DB_WACHTWOORD}
      POSTGRES_DB: postgres
    volumes:
      # Benoemd volume per omgeving: de data van acceptatie en productie raken
      # elkaar nooit. Dit is het onderdeel dat "gescheiden omgevingen" echt
      # maakt in plaats van alleen andere poortnummers.
      - db-data:/var/lib/postgresql/data
    # Alleen bereikbaar binnen het compose-netwerk plus, via de host, op
    # 127.0.0.1. Nooit 0.0.0.0: de server hangt aan Tailscale én aan het
    # thuisnetwerk, en een database met een wachtwoord uit een .env hoort daar
    # niet aan te luisteren.
    ports:
      - "127.0.0.1:${DB_POORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    image: ${API_IMAGE}
    environment:
      # De echte vingerafdruk van dit image, gemeten door deploy.js na de pull
      # (pariteitscontract §2, indicator 1). Meldt /health terug. Leeg wanneer
      # de meting mislukte — het endpoint maakt daar null van, niet een lege
      # tekst, want dat is voor verify-omgevingen.js het signaal dat er iets
      # ontbreekt in plaats van dat er niets afwijkt.
      IMAGE_DIGEST: ${IMAGE_DIGEST:-}
      FRONTEND_IMAGE_DIGEST: ${FRONTEND_IMAGE_DIGEST:-}
      # Welke omgeving dit is (acceptatie/staging/productie), gezet door
      # deploy.js. Meldt /health terug — zie health.controller.ts.
      OMGEVING: ${OMGEVING:-}
      # Waar de database staat. Vóór 2026-08-11 stond hier een vaste
      # connectiestring naar de `db`-service hierboven; dat kon niet meer toen
      # staging erbij kwam, want die praat met Supabase.
      #
      # De omgevingsbestanden van acceptatie en productie vullen dit met
      # precies de oude waarde — `deploy-inrichten.js` schrijft hem — dus voor
      # die twee verandert er niets. Staging krijgt de Supabase-URL.
      DATABASE_URL: ${DATABASE_URL}
      PORT: "5001"
      CORS_ORIGIN: ${FRONTEND_URL}
      # Het sessiecookie draagt standaard de __Host--prefix en Secure; dat
      # weigert elke browser over http. Zie sessie.ts — de standaard faalt naar
      # de veilige kant, en `true` is de bewuste uitzondering.
      #
      # Sinds 2026-08-10 per omgeving instelbaar in plaats van hier vastgezet.
      # Acceptatie draait via `tailscale serve` over HTTPS met een geldig
      # certificaat en heeft de uitzondering dus niet meer nodig; productie
      # draait nog over http en wel.
      #
      # Aanleiding: Entra accepteert geen http-redirect behalve op localhost.
      # Het adres van acceptatie moest daarom naar https, en dan is deze
      # verzwakking niet alleen overbodig maar ook schadelijk — een cookie
      # zonder Secure reist ook mee over een onversleutelde verbinding.
      #
      # Leeg of afwezig = veilig. Alleen de letterlijke tekst "true" zet het uit.
      SESSIE_COOKIE_INSECURE: ${SESSIE_COOKIE_INSECURE:-}
      #
      # Bewust GEEN omgevingsvariabele die "acceptatie" of "productie" zegt.
      # De app leest zoiets nergens: de oranje balk komt uit de tenantnaam in
      # de sessie (OmgevingBanner.tsx), niet uit een variabele. Die keuze is
      # opzet — een variabele kan per ongeluk meegaan naar productie of juist
      # ontbreken, en dan waarschuwt hij op het verkeerde moment.
      #
      # Wil je de omgeving zichtbaar maken in het scherm, dan is de weg: een
      # tenant met een herkenbare naam in de acceptatiedatabase.
      #
      # ── Inloggen via Microsoft Entra (Issue #7) ────────────────────────────
      #
      # Deze ontbraken tot 2026-08-10. Gevolg: /auth/login gaf een kale 500 in
      # de browser, terwijl in het serverlog netjes stond wélke variabelen
      # misten. Precies de faalvorm die dit project vaker heeft gehad — de
      # oorzaak stond er, alleen niet waar iemand keek.
      #
      # De waarden komen uit het omgevingsbestand op de server; ze staan hier
      # niet, want OIDC_CLIENT_SECRET is een geheim en dit bestand zit in git.
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_TOKEN_ENDPOINT: ${OIDC_TOKEN_ENDPOINT}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      #
      # LET OP: deze wijst naar de FRONTEND, niet naar de backend zelf.
      #
      # De backend zet bij /auth/login een pogingcookie en leest dat bij
      # /auth/callback terug. Lopen die twee over verschillende herkomsten —
      # de een via poort 3010, de ander via 5011 — dan stuurt de browser het
      # cookie niet mee en mislukt élke login op een ontbrekende state.
      #
      # Sinds Issue #51 klikt de gebruiker op de frontend, dus moet de callback
      # daar terugkomen. Dit adres moet als redirect-URI geregistreerd staan in
      # de app-registratie bij Entra, anders weigert Microsoft de poging met
      # AADSTS50011.
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI}
      #
      # Waar de gebruiker landt na in- en uitloggen. Zonder deze twee valt de
      # backend terug op '/' — en dat is de backend-poort, waar geen scherm
      # staat.
      NA_LOGIN_URL: ${NA_LOGIN_URL}
      NA_LOGOUT_URL: ${NA_LOGOUT_URL}
      #
      # Waar links naartoe wijzen die een ontvanger in zijn browser opent
      # (Issue #132). Beide de frontend: het portaal voor de leverancier, het
      # doorgeefluik naar /auth/login voor een nieuwe tenantbeheerder.
      #
      # Ontbraken tot 2026-08-10. Elke uitgerolde omgeving gaf daardoor een
      # uitnodigingslink naar localhost — en zo'n token bestaat maar één keer,
      # dus die link is niet te repareren.
      PORTAAL_BASIS_URL: ${PORTAAL_BASIS_URL}
      UITNODIGING_BASIS_URL: ${UITNODIGING_BASIS_URL}
    ports:
      - "${API_POORT}:5001"
    # GEEN `depends_on: db` hier, en dat is geen omissie.
    #
    # Docker Compose weigert een heel compose-bestand als een service verwijst
    # naar een dienst achter een inactief profiel: "service api depends on
    # undefined service db: invalid compose project". Niet alleen de api start
    # dan niet — het hele project is ongeldig. Gemeten op 2026-08-11.
    #
    # Voor omgevingen mét een lokale database staat de afhankelijkheid in
    # `compose.lokale-db.yml`, dat er als tweede `-f` overheen gelegd wordt.
    # Staging heeft die overlay niet: daar staat de database bij Supabase en is
    # er niets om op te wachten.
    restart: unless-stopped

  # ── De frontend, promoveerbaar sinds Issue #51 ────────────────────────────
  #
  # Hier stond een `profiles:`-regel die deze service standaard uitzette. Reden:
  # `NEXT_PUBLIC_API_URL` werd tijdens de BUILD in de bundel gebakken, dus één
  # image wist al of het met de acceptatie- of de productiebackend praatte. Dat
  # maakte promoveren onmogelijk — het image dat op acceptatie beproefd was zou
  # op productie de verkeerde backend aanroepen.
  #
  # De frontend leest dat adres nu bij het STARTEN, uit `API_BASE_URL`. Daarmee
  # is hetzelfde image bruikbaar op elke omgeving en draait hij gewoon mee.
  frontend:
    image: ${FRONTEND_IMAGE}
    environment:
      # `api`, niet `localhost`: dit adres wordt aangeroepen door de
      # frontend-CONTAINER, en daarbinnen is localhost de container zelf. De
      # servicenaam uit dit compose-netwerk is het enige dat werkt.
      #
      # Let op het verschil met CORS_ORIGIN hierboven: dat is een adres dat de
      # BROWSER gebruikt en dus van buitenaf moet kloppen. Deze twee zien er
      # verwarrend genoeg allebei uit als "waar staat de ander".
      API_BASE_URL: http://api:5001
    ports:
      - "${FRONTEND_POORT}:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db-data:
