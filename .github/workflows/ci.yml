name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Handmatig starten vanaf een willekeurige branch: `gh workflow run ci.yml
  # --ref <branch>`, of via de Actions-tab op GitHub.
  #
  # Toegevoegd op 2026-08-06. Aanleiding: GitHub maakte die dag herhaaldelijk
  # geen run aan (PR #91 kreeg er geen, de run na PR #90 werd afgebroken met
  # drie `cancelled` jobs zonder één falende stap). Zonder deze trigger is er
  # geen enkele manier om een controle af te dwingen; je kunt dan alleen een
  # lege commit maken en hopen dat het de tweede keer wel lukt.
  workflow_dispatch:

permissions:
  contents: read
  # Nodig om het image naar GitHub Container Registry te publiceren. Alleen de
  # publiceer-job gebruikt dit; de andere jobs komen niet aan het register.
  packages: write

jobs:
  quality:
    name: Format, lint en typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js instellen
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Dependencies installeren
        run: npm ci

      - name: Format controleren
        run: npm run format:check

      - name: Lint
        run: npm run lint:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  docker-build:
    name: Docker productiebuild
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Productie-image bouwen
        run: docker build -t mcm2-api:ci .

      # Een image die bouwt is nog geen image die draait: bij de Prisma
      # 7-blokkade slaagde de build wel en faalde pas het opstarten. Deze stap
      # start de container zonder database-URL en verwacht dat hij daarop
      # afbreekt met de eigen foutmelding — dat bewijst dat het gecompileerde
      # resultaat daadwerkelijk laadt (MCM2-CLAUDE.md §5, criterium 1).
      - name: Image start het gecompileerde resultaat
        run: |
          output=$(docker run --rm mcm2-api:ci 2>&1 || true)
          echo "$output"
          echo "$output" | grep -q "DATABASE_URL ontbreekt" || {
            echo "::error::Container startte niet tot aan de configuratiecontrole."
            exit 1
          }

  rls-isolation:
    name: RLS tenant-isolatietest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.2
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # CI-eigen, wegwerpbare Postgres-container — geen productiegeheim.
      PGPASSWORD: postgres
      MIGRATION_DATABASE_URL: "postgresql://clm_migrator:clm_migrator_ci_pw@localhost:5432/postgres?schema=public"
      DATABASE_URL: "postgresql://clm_api_runtime:clm_api_runtime_ci_pw@localhost:5432/postgres?schema=public"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js instellen
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Dependencies installeren
        run: npm ci

      - name: Rollen bootstrappen op de CI-database
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -v ON_ERROR_STOP=1 -f db/roles/bootstrap-roles.sql
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -v ON_ERROR_STOP=1 -c "ALTER ROLE clm_api_runtime PASSWORD 'clm_api_runtime_ci_pw';"
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -v ON_ERROR_STOP=1 -c "ALTER ROLE clm_migrator PASSWORD 'clm_migrator_ci_pw';"

      # Draait tegen een lege database: bewijst dat de migratieketen vanaf
      # niets reproduceerbaar is (MCM2-CLAUDE.md §5, criterium 5).
      - name: Migraties toepassen (via clm_migrator)
        run: npm run migrate:deploy

      # De e2e-suites weigeren te draaien tegen een database die niet als
      # wegwerp is gemarkeerd (migratie 0019, test/jest-e2e.setup.ts). Deze
      # service-container leeft één job lang, dus dat is hij per definitie.
      #
      # Zonder deze stap loopt de RLS-isolatietest hierna vast met de melding
      # dat de database beschermd is — de guard werkt dan, alleen tegen de
      # verkeerde database.
      - name: Database markeren als wegwerp
        run: node scripts/markeer-wegwerp.js "CI — service-container"

      # Poort tegen een tenantgebonden tabel zonder RLS. drizzle-kit genereert
      # geen RLS (ADR-010), dus een nieuwe tabel met tenant_id krijgt niet
      # automatisch een policy. De verwachting komt uit src/db/schema.ts, niet
      # uit een lijst die veroudert.
      - name: Schema-conformiteit en RLS-dekking
        run: npx jest --config ./test/jest-e2e.json test/schema-conformiteit.e2e-spec.ts

      # Alle isolatietests: via ruwe pg-queries, via de Drizzle-querylaag, en
      # het tokengebaseerde pad voor externe leveranciers (Issue #10).
      - name: Tenant- en token-isolatietests draaien (via clm_api_runtime)
        run: npx jest --config ./test/jest-e2e.json

  # ── Het uitrolbare artefact ────────────────────────────────────────────────
  #
  # Publiceert het productie-image naar GitHub Container Registry, zodat
  # acceptatie en productie hét image kunnen ophalen dat hier getest is —
  # niet een image dat daar opnieuw gebouwd wordt.
  #
  # Dat onderscheid is de kern van OTAP. Bouwt de doelomgeving zelf, dan is het
  # per definitie een ánder artefact dan wat door de poorten kwam: andere
  # basis-image-laag, andere npm-resolutie, andere buildtijd. Dan bewijst een
  # groene acceptatietest niets over productie.
  #
  # ── Waarom alleen op main ──────────────────────────────────────────────────
  #
  # Een PR-branch publiceren zou het register vullen met images die nooit
  # uitgerold worden, en `:latest` laten wijzen naar ongemergde code. De
  # docker-build-job hierboven blijft wél op elke PR draaien — die bewijst dat
  # het image bouwt, dit publiceert het pas als het door main heen is.
  publiceren:
    name: Image publiceren naar GHCR
    runs-on: ubuntu-latest
    needs: [quality, docker-build, rls-isolation]
    # Publiceren mag alleen vanaf main, maar wél via beide wegen erheen: een
    # gewone push, én een handmatige start.
    #
    # Die tweede is niet theoretisch. Op 2026-08-10 raakte de repository kwijt
    # en werd hij hersteld; GitHub pikte de push-triggers daarna niet meer op,
    # en met alleen `event_name == 'push'` was er geen enkele manier om het
    # publiceren af te dwingen. Dezelfde klasse storing als op 2026-08-06, toen
    # `workflow_dispatch` juist om die reden is toegevoegd (PR #92).
    #
    # De branchvoorwaarde blijft staan: publiceren vanaf een willekeurige branch
    # zou `:latest` laten wijzen naar ongemergde code.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inloggen bij GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Twee tags op hetzelfde image:
      #   :sha-<commit>  onveranderlijk, en dus waar een rollback naar terug kan
      #   :latest        wat `deploy:acceptatie` standaard ophaalt
      #
      # De commit-tag is de belangrijkste. Zonder een onveranderlijke verwijzing
      # is "dezelfde versie terugzetten" niet uitvoerbaar: `:latest` van
      # gisteren bestaat morgen niet meer.
      # De `image.source`-label is niet cosmetisch: zonder dat koppelt GitHub het
      # pakket niet aan deze repository. Het gevolg is verwarrend — de
      # pakketinstellingen tonen dan "Public" terwijl het overzicht "Private"
      # zegt, en de registry weigert een anonieme pull met `unauthorized`.
      # Zichtbaarheid wordt namelijk van de gekoppelde repo geërfd, en zonder
      # koppeling is er niets om van te erven.
      #
      # Gevonden op 2026-08-10, bij de eerste uitrol naar saxombp.
      - name: Image bouwen en publiceren
        run: |
          REPO=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          SHA_TAG="$REPO/api:sha-${GITHUB_SHA::12}"
          LATEST_TAG="$REPO/api:latest"

          docker build \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t "$SHA_TAG" -t "$LATEST_TAG" .

          docker push "$SHA_TAG"
          docker push "$LATEST_TAG"

          echo "Gepubliceerd:"
          echo "  $SHA_TAG"
          echo "  $LATEST_TAG"

  # ── Uitrol naar staging ────────────────────────────────────────────────────
  #
  # Stap 3 van docs/architectuur/plan-otap-straat-met-staging.md.
  #
  # Staging is een tweede Supabase-project (`clm-staging3`). Dat is geen
  # willekeurige keuze: productie draait Postgres bij AWS in Ierland achter een
  # connection pooler, en een repetitie in een lokale container bewijst het
  # verkeerde. De pooler is precies de plek waar het anders gaat — verbindingen
  # die anders worden vastgehouden, andere timeouts, ander gedrag bij migraties
  # die een tabel vergrendelen (§1 van het plan).
  #
  # ── Wat deze job wél en niet doet ──────────────────────────────────────────
  #
  # WEL: migraties draaien tegen staging en TERUGLEZEN of ze geland zijn.
  # NIET: de applicatie op saxombp vervangen — dat blijft één commando met de
  # hand, zie de toelichting onderaan deze job.
  #
  # De migratiehelft is de waardevolste, en dat is geen troostprijs. Migraties
  # zijn waar het misgaat: op 2026-08-07 meldde `migrate:deploy` "Migraties
  # voltooid" terwijl er niets gebeurde, en in Issue #86 gebeurde het op de
  # verkeerde database. Beide keren was de melding waar over iets anders.
  #
  # Het is bovendien de helft die een verhuizing naar AWS overleeft. Migreren
  # tegen RDS werkt precies zo; SSH naar een machine thuis verdwijnt dan.
  staging:
    name: Migraties naar staging
    runs-on: ubuntu-latest
    needs: [publiceren]
    # Alleen vanaf main, en alleen als er werkelijk een image is gepubliceerd.
    # `needs` dekt dat al, maar de expliciete voorwaarde blijft staan: een job
    # die per ongeluk op een branch draait, migreert een echte database.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js instellen
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Dependencies installeren
        run: npm ci

      # ── Vóór ──────────────────────────────────────────────────────────────
      #
      # De stand vastleggen voordat er iets gebeurt. Zonder deze meting is
      # "onveranderd" achteraf niet te onderscheiden van "niets gedaan".
      - name: Migratiestand vóór de uitrol
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.STAGING_MIGRATION_DATABASE_URL }}
        run: |
          VOOR=$(node scripts/migratiestand.js | grep -oE '[0-9]+$' | head -1)
          echo "VOOR=$VOOR" >> "$GITHUB_ENV"
          echo "Staging stond op $VOOR migraties."

      # `--extern` staat hier expliciet bij de aanroep en niet als
      # omgevingsvariabele. Het runbook eist dat die vlag een zichtbare,
      # bewuste uitzondering blijft: hij hoort terug te zien te zijn in de
      # pipeline. Een `MCM2_EXTERNE_DB=ja` in de omgeving zou hem onzichtbaar
      # maken voor elke volgende stap — precies wat er niet mag.
      - name: Migraties draaien tegen staging
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.STAGING_MIGRATION_DATABASE_URL }}
        run: node scripts/migrate.js --extern

      # ── Ná: teruglezen, niet de melding geloven ───────────────────────────
      #
      # `--volgens-journal` vergelijkt met drizzle/meta/_journal.json — het
      # bestand dat migrate() zelf leest. Wat daarin staat is per definitie wat
      # er na een geslaagde uitrol op de database hoort te staan.
      #
      # Een getal in dit bestand zou verouderen bij de volgende migratie, en
      # dan faalt de controle om de verkeerde reden of blijft hij groen terwijl
      # er iets ontbreekt.
      - name: Migratiestand teruglezen en vergelijken met de repository
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.STAGING_MIGRATION_DATABASE_URL }}
        run: node scripts/migratiestand.js --volgens-journal

      # De runtime-rol moet er ook bij kunnen. Slaagt de migratie maar faalt
      # deze stap, dan staan de rechten verkeerd — en dat merk je anders pas
      # wanneer de applicatie start en elk scherm een fout geeft.
      - name: De runtime-rol kan bij zijn eigen gegevens
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          node -e "
            const {Client} = require('pg');
            const c = new Client({
              connectionString: process.env.DATABASE_URL,
              ssl: { rejectUnauthorized: false },
              connectionTimeoutMillis: 30000,
            });
            c.connect()
              .then(() => c.query('SELECT count(*)::int AS n FROM clm.tenant'))
              .then((r) => {
                console.log('clm_api_runtime leest clm.tenant: ' + r.rows[0].n + ' rijen');
                return c.end();
              })
              .catch((e) => { console.error('MISLUKT: ' + e.message); process.exit(1); });
          "

      # ── De applicatie starten gebeurt met de hand ─────────────────────────
      #
      # Hier stonden drie stappen die de runner via Tailscale bij saxombp
      # lieten komen. Ze zijn verwijderd op 2026-08-11, en de reden is een
      # harde regel van Tailscale — geen instelling die verkeerd stond:
      #
      #   "Devices with a tag-based identity can only SSH into other tagged
      #    devices; they cannot SSH into devices with a user-based identity."
      #
      # De CI-runner krijgt onvermijdelijk een label. saxombp heeft er geen en
      # is eigendom van de gebruiker. Er bestáát dus geen geldige SSH-regel die
      # dit toestaat; drie pogingen konden nooit werken.
      #
      # De enige oplossing is saxombp óók labelen. Dat verwijdert de
      # gebruiker als eigenaar ("applying a tag removes the user account") en
      # raakt daarmee de HTTPS-opzet van acceptatie — de enige weg naar de
      # inlog. Bewust niet gedaan (besluit eigenaar 2026-08-11): het levert
      # alleen op dat één commando vanzelf gaat, en precies dat commando
      # verdwijnt bij een verhuizing naar AWS, waar geen SSH aan te pas komt.
      #
      # Een stap die altijd faalt is erger dan geen stap: dan wordt elke run
      # rood en leer je rode runs negeren.
      - name: Herinnering — de applicatie starten
        run: |
          echo "::notice::Migraties staan op staging. Start de applicatie met: npm run deploy:staging -- --versie sha-${GITHUB_SHA:0:12}"

      - name: Samenvatting
        if: always()
        run: |
          echo "### Staging bijgewerkt" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${GITHUB_SHA::12}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Migraties vóór | $VOOR |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Migraties ná | teruggelezen, gelijk aan het journal |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**De applicatie is nog niet vervangen.** Dat gebeurt met de hand:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          echo "npm run deploy:staging -- --versie sha-${GITHUB_SHA::12}" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Staging: http://saxombp:3030 (backend :5031), database bij Supabase." >> "$GITHUB_STEP_SUMMARY"
